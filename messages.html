<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Your project conversation | CleverStack</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='20' height='20' rx='5' fill='%234F46E5'/><rect y='40' width='20' height='20' rx='5' fill='%2300C2A8'/><rect y='80' width='20' height='20' rx='5' fill='%23FF6B4A'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="style.css?v=1b5023b3">
<link rel="stylesheet" href="chat-ui.css?v=ffc185d3">
<script>try{var t=localStorage.getItem('cleverstack_theme');document.documentElement.setAttribute('data-theme',t==='light'?'light':'dark')}catch(e){document.documentElement.setAttribute('data-theme','dark')}</script>
<style>
  body{min-height:100vh;margin:0;background:var(--paper)}
  [data-theme=light] body{background:#F5F6FB}
  .pt-bg{position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(46rem 34rem at 0% 0%,rgba(99,102,241,.22),transparent 70%),radial-gradient(40rem 32rem at 100% 30%,rgba(45,212,191,.14),transparent 70%),radial-gradient(42rem 32rem at 60% 100%,rgba(244,114,182,.08),transparent 70%)}
  .pt-wrap{max-width:820px;margin:0 auto;padding:22px 16px 20px;height:100vh;height:100dvh;box-sizing:border-box;display:flex;flex-direction:column;gap:14px}
  .pt-glass{border-radius:20px;-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%)}
  [data-theme=dark] .pt-glass{background:linear-gradient(145deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.1);box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 22px 44px -26px rgba(0,0,0,.85)}
  [data-theme=light] .pt-glass{background:linear-gradient(140deg,rgba(255,255,255,.78),rgba(255,255,255,.55));border:1px solid rgba(255,255,255,.8);box-shadow:inset 0 1px 0 #fff,0 0 0 1px rgba(15,23,42,.05),0 14px 34px -16px rgba(31,38,135,.22)}
  .pt-head{display:flex;align-items:center;gap:14px;padding:14px 18px;flex:0 0 auto}
  .pt-head .logo{font-size:19px}
  .pt-head .pt-sub{margin-left:auto;text-align:right;min-width:0}
  .pt-head .pt-sub b{display:block;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text-dark)}
  .pt-head .pt-sub span{font-size:.78rem;color:var(--text-muted)}
  .pt-pill{display:inline-block;padding:2px 9px;border-radius:100px;font-size:.7rem;font-weight:700;background:rgba(45,212,191,.16);color:#2AA79F;margin-left:6px}
  .pt-box{position:relative;display:flex;flex-direction:column;flex:1;min-height:0}
  .pt-thread{flex:1;min-height:0;padding:18px}
  .pt-compose{display:flex;gap:6px;align-items:flex-end;padding:10px 12px 12px;border-top:1px solid rgba(127,127,127,.14)}
  [data-theme=dark] .pt-compose{color:#E4E4E7}
  [data-theme=light] .pt-compose{color:#3F3F46}
  .pt-compose textarea{flex:1;min-width:0;min-height:44px;max-height:200px;resize:none;border-radius:14px;padding:11px 14px;font:500 .95rem var(--font-body);outline:none;border:1px solid transparent}
  [data-theme=dark] .pt-compose textarea{background:rgba(0,0,0,.3);color:#F4F4F5;border-color:rgba(255,255,255,.1)}
  [data-theme=light] .pt-compose textarea{background:#fff;color:#18181B;border-color:rgba(15,23,42,.1)}
  .pt-compose textarea:focus{border-color:#818CF8;box-shadow:0 0 0 3px rgba(99,102,241,.2)}
  .pt-send{height:44px;padding:0 20px;border:0;border-radius:14px;background:linear-gradient(135deg,#4F46E5,#6366F1);color:#fff;font:600 .95rem var(--font-body);cursor:pointer;flex:0 0 auto}
  .pt-note{font-size:.76rem;color:var(--text-muted);text-align:center;padding:0 8px;margin:0;flex:0 0 auto}
  .pt-error{padding:28px;text-align:center;color:var(--text-dark)}
  .pt-error p{color:var(--text-muted)}
  .pt-msgerr{color:#F87171;font-size:.82rem;padding:0 16px 6px}
  .pt-msgerr:empty{display:none}
  .hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
  @media(max-width:600px){.pt-wrap{padding:12px 10px 12px;gap:10px}.pt-head{padding:12px 14px}.pt-head .logo{font-size:17px}.pt-thread{padding:14px 12px}.pt-send{padding:0 16px}.pt-compose .ch-tool{width:36px}}
  @media(prefers-reduced-transparency:reduce){.pt-glass{-webkit-backdrop-filter:none;backdrop-filter:none}[data-theme=dark] .pt-glass{background:#15151c}[data-theme=light] .pt-glass{background:#fff}}
</style>
</head>
<body>
<div class="pt-bg"></div>
<main class="pt-wrap">
  <header class="pt-head pt-glass">
    <a href="/" class="logo"><span class="stackmark"></span>Clever<span class="dot">Stack</span></a>
    <div class="pt-sub"><b id="ptSubject">Your project conversation</b><span id="ptStatus">Loading…</span></div>
  </header>
  <section class="pt-glass pt-box" id="ptBox">
    <div class="pt-thread" id="ptThread" aria-live="polite"></div>
    <div class="pt-msgerr" id="ptErr" role="alert"></div>
    <form class="pt-compose" id="ptForm">
      <input class="hp" name="company_website" tabindex="-1" autocomplete="off" aria-hidden="true">
      <button type="button" class="ch-tool" id="ptAttach" aria-label="Attach a file" title="Attach a file (images, PDF, Word, Excel, ZIP · max 4 MB)"></button>
      <button type="button" class="ch-tool" id="ptEmoji" aria-label="Insert an emoji" title="Emoji"></button>
      <label for="ptBody" class="visually-hidden">Your message</label>
      <textarea id="ptBody" rows="1" maxlength="5000" placeholder="Write a message…"></textarea>
      <button type="submit" class="pt-send" id="ptSend">Send</button>
    </form>
  </section>
  <p class="pt-note">This is your private conversation with the CleverStack team. We also email you when we reply. Please do not share this link.</p>
</main><script>/* show what is already on screen without waiting for the animation scripts */(function(){var h=innerHeight;document.querySelectorAll(".reveal,.reveal-left,.reveal-right,.reveal-scale,.stagger").forEach(function(e){if(e.getBoundingClientRect().top<h)e.classList.add("in")})})();</script>
<script src="chat-ui.js?v=79ac6803"></script>
<script>
(function () {
  'use strict';
  var token = ((location.search + location.hash).match(/[?&#]c=([A-Za-z0-9_-]{40,60})/) || [])[1] || '';
  var form = document.getElementById('ptForm'), box = document.getElementById('ptBody'), err = document.getElementById('ptErr');
  var since = '', editMinutes = 15, busy = false, timer = null, loaded = false;
  var STATUS = { open: 'Open', waiting: 'Awaiting your reply', won: 'Project confirmed', closed: 'Closed' };
  function fail(title, text) { document.getElementById('ptBox').outerHTML = '<section class="pt-glass pt-error"><h2>' + title + '</h2><p>' + text + '</p><p><a class="btn btn-primary" href="/contact">Contact us</a></p></section>'; document.getElementById('ptStatus').textContent = ''; clearInterval(timer); }
  if (!token) { fail('Link incomplete', 'This conversation link is missing part of its address. Please open it again from your email.'); return; }
  // remove the secret from the address bar / history once read
  try { history.replaceState(null, '', location.pathname + '#c=' + token); } catch (e) {}
  var T = encodeURIComponent(token);
  document.getElementById('ptAttach').innerHTML = CSChat.ICON.clip;
  document.getElementById('ptEmoji').innerHTML = CSChat.ICON.smile;

  function age(m) { var d = new Date(String(m.created_at).replace(' ', 'T') + 'Z'); return (Date.now() - d) / 1000; }
  function norm(m) { m.created_at = m.at; return m; }
  function post(body) {
    return fetch('/api/portal', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign({ t: token }, body)) })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { if (!r.ok) throw new Error(d.error || 'Could not send'); return d; }); });
  }
  function download(f) { var a = document.createElement('a'); a.href = '/api/portal?t=' + T + '&file=' + f.id + '&dl=1'; a.download = f.name; a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove(); }

  var thread = CSChat.thread(document.getElementById('ptThread'), {
    mine: function (m) { return m.from === 'you'; },
    name: function (m) { return m.from === 'you' ? 'You' : (m.name || 'CleverStack'); },
    fileSrc: function (f) { return '/api/portal?t=' + T + '&file=' + f.id; },
    download: download,
    canEdit: function (m) { return m.from === 'you' && age(m) < editMinutes * 60; },
    canDelete: function (m) { return m.from === 'you' && age(m) < editMinutes * 60; },
    onEdit: function (m, text) { return post({ op: 'edit', id: m.id, body: text }).then(function () { load(false); }); },
    onDelete: function (m) { return post({ op: 'delete', id: m.id }).then(function () { load(false); }); }
  });

  function load(first) {
    if (busy) return Promise.resolve(); busy = true;
    return fetch('/api/portal?t=' + T + '&after=' + thread.lastId() + '&since=' + encodeURIComponent(since), { cache: 'no-store' })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { return { ok: r.ok, status: r.status, d: d }; }); })
      .then(function (x) {
        if (!x.ok) { if (first || x.status === 404) fail('This link no longer works', x.d.error || 'Please ask us for a new link.'); return; }
        var c = x.d.conversation;
        document.getElementById('ptSubject').textContent = c.subject;
        var st = document.getElementById('ptStatus'); st.textContent = c.name ? 'Hi ' + c.name.split(' ')[0] + ' · ' : '';
        var pill = document.createElement('span'); pill.className = 'pt-pill'; pill.textContent = STATUS[c.status] || ''; st.appendChild(pill);
        editMinutes = x.d.editMinutes || editMinutes;
        var fresh = thread.add(x.d.messages.map(norm), { initial: first });
        thread.update((x.d.changed || []).map(norm));
        thread.seen(x.d.seen);
        thread.typing(x.d.typing, 'The CleverStack team');
        since = x.d.now || since;
        if (loaded) CSChat.alert(fresh);
        loaded = true;
      }).catch(function () {}).then(function () { busy = false; });
  }
  function settle() { busy = false; return load(false); }

  function sendText(text) {
    err.textContent = '';
    var p = thread.pending(text, false);
    post({ body: text, company_website: form.company_website.value })
      .then(function () { return settle().then(p.done); })
      .catch(function (e) { p.fail(e.message, function () { sendText(text); }); });
  }
  function sendFiles(files) {
    err.textContent = '';
    files.slice(0, 10).reduce(function (chain, file) {
      return chain.then(function () {
        return CSChat.prepareFile(file).then(function (f) {
          var p = thread.pending(f.name, true);
          return CSChat.upload('/api/portal?t=' + T + '&name=' + encodeURIComponent(f.name), f.blob, {}, p.progress)
            .then(function () { return settle().then(p.done); })
            .catch(function (e) { p.fail(e.message, function () { sendFiles([file]); }); });
        }, function (e) { err.textContent = e.message; });
      });
    }, Promise.resolve());
    if (files.length > 10) err.textContent = 'You can send up to 10 files at a time.';
  }

  CSChat.composer({ form: form, input: box, attach: document.getElementById('ptAttach'), emoji: document.getElementById('ptEmoji'), drop: document.getElementById('ptBox'),
    onSend: sendText, onFiles: sendFiles, onTyping: function () { post({ op: 'typing' }).catch(function () {}); } });

  // poll quickly while the page is open, slowly in a background tab (still enough for the title alert)
  var ticks = 0;
  timer = setInterval(function () { ticks++; if (document.visibilityState === 'visible' || ticks % 4 === 0) load(false); }, 4000);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') load(false); });
  load(true).then(function () { box.focus({ preventScroll: true }); });
})();
</script>
</body>
</html>
