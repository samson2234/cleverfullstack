<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Your project conversation | CleverStack</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='20' height='20' rx='5' fill='%234F46E5'/><rect y='40' width='20' height='20' rx='5' fill='%2300C2A8'/><rect y='80' width='20' height='20' rx='5' fill='%23FF6B4A'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="style.css?v=f07baffc">
<script>try{var t=localStorage.getItem('cleverstack_theme');document.documentElement.setAttribute('data-theme',t==='light'?'light':'dark')}catch(e){document.documentElement.setAttribute('data-theme','dark')}</script>
<style>
  body{min-height:100vh;margin:0;background:var(--paper)}
  [data-theme=light] body{background:#F5F6FB}
  .pt-bg{position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(46rem 34rem at 0% 0%,rgba(99,102,241,.22),transparent 70%),radial-gradient(40rem 32rem at 100% 30%,rgba(45,212,191,.14),transparent 70%),radial-gradient(42rem 32rem at 60% 100%,rgba(244,114,182,.08),transparent 70%)}
  .pt-wrap{max-width:820px;margin:0 auto;padding:22px 16px 28px;min-height:100vh;display:flex;flex-direction:column;gap:14px}
  .pt-glass{border-radius:20px;-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%)}
  [data-theme=dark] .pt-glass{background:linear-gradient(145deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.1);box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 22px 44px -26px rgba(0,0,0,.85)}
  [data-theme=light] .pt-glass{background:linear-gradient(140deg,rgba(255,255,255,.78),rgba(255,255,255,.55));border:1px solid rgba(255,255,255,.8);box-shadow:inset 0 1px 0 #fff,0 0 0 1px rgba(15,23,42,.05),0 14px 34px -16px rgba(31,38,135,.22)}
  .pt-head{display:flex;align-items:center;gap:14px;padding:14px 18px}
  .pt-head .logo{font-size:19px}
  .pt-head .pt-sub{margin-left:auto;text-align:right;min-width:0}
  .pt-head .pt-sub b{display:block;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text-dark)}
  .pt-head .pt-sub span{font-size:.78rem;color:var(--text-muted)}
  .pt-pill{display:inline-block;padding:2px 9px;border-radius:100px;font-size:.7rem;font-weight:700;background:rgba(45,212,191,.16);color:#2AA79F;margin-left:6px}
  .pt-thread{flex:1;display:flex;flex-direction:column;gap:10px;padding:18px;overflow-y:auto;min-height:320px;max-height:calc(100vh - 290px)}
  .pt-msg{max-width:78%;display:flex;flex-direction:column;gap:4px}
  .pt-msg.you{align-self:flex-end;align-items:flex-end}
  .pt-bubble{padding:11px 15px;border-radius:18px;font-size:.95rem;line-height:1.55;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere}
  .pt-msg.you .pt-bubble{background:linear-gradient(135deg,#4F46E5,#6366F1);color:#fff;border-bottom-right-radius:6px}
  .pt-msg.them .pt-bubble{border-bottom-left-radius:6px}
  [data-theme=dark] .pt-msg.them .pt-bubble{background:rgba(255,255,255,.08);color:#F4F4F5;border:1px solid rgba(255,255,255,.08)}
  [data-theme=light] .pt-msg.them .pt-bubble{background:#fff;color:#18181B;border:1px solid rgba(15,23,42,.08)}
  .pt-meta{font-size:.72rem;color:var(--text-muted);padding:0 6px}
  .pt-day{align-self:center;font-size:.72rem;color:var(--text-muted);padding:4px 10px;border-radius:100px;background:rgba(127,127,127,.1);margin:6px 0}
  .pt-compose{display:flex;gap:10px;align-items:flex-end;padding:12px}
  .pt-compose textarea{flex:1;min-height:48px;max-height:200px;resize:none;border-radius:14px;padding:13px 15px;font:500 .95rem var(--font-body);outline:none;border:1px solid transparent}
  [data-theme=dark] .pt-compose textarea{background:rgba(0,0,0,.3);color:#F4F4F5;border-color:rgba(255,255,255,.1)}
  [data-theme=light] .pt-compose textarea{background:#fff;color:#18181B;border-color:rgba(15,23,42,.1)}
  .pt-compose textarea:focus{border-color:#818CF8;box-shadow:0 0 0 3px rgba(99,102,241,.2)}
  .pt-compose button{height:48px;padding:0 22px;border:0;border-radius:14px;background:linear-gradient(135deg,#4F46E5,#6366F1);color:#fff;font:600 .95rem var(--font-body);cursor:pointer;flex:0 0 auto}
  .pt-compose button:disabled{opacity:.6;cursor:default}
  .pt-note{font-size:.76rem;color:var(--text-muted);text-align:center;padding:0 8px}
  .pt-error{padding:28px;text-align:center;color:var(--text-dark)}
  .pt-error p{color:var(--text-muted)}
  .pt-msgerr{color:#F87171;font-size:.82rem;padding:0 14px 8px}
  .hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
  @media(max-width:600px){.pt-msg{max-width:90%}.pt-head .logo{font-size:17px}.pt-thread{max-height:calc(100vh - 260px)}}
  @media(prefers-reduced-transparency:reduce){.pt-glass{-webkit-backdrop-filter:none;backdrop-filter:none}[data-theme=dark] .pt-glass{background:#15151c}[data-theme=light] .pt-glass{background:#fff}}
</style>
</head>
<body>
<div class="pt-bg"></div>
<main class="pt-wrap">
  <header class="pt-head pt-glass">
    <a href="/" class="logo"><span class="stackmark"></span>Clever<span class="dot">Stack</span></a>
    <div class="pt-sub"><b id="ptSubject">Your project conversation</b><span id="ptStatus">Loading…</span></div>
  </header>
  <section class="pt-glass" style="display:flex;flex-direction:column;flex:1;min-height:0">
    <div class="pt-thread" id="ptThread" aria-live="polite"></div>
    <div class="pt-msgerr" id="ptErr" role="alert"></div>
    <form class="pt-compose" id="ptForm">
      <input class="hp" name="company_website" tabindex="-1" autocomplete="off" aria-hidden="true">
      <label for="ptBody" class="visually-hidden">Your message</label>
      <textarea id="ptBody" rows="1" maxlength="5000" placeholder="Write a message…" required></textarea>
      <button type="submit" id="ptSend">Send</button>
    </form>
  </section>
  <p class="pt-note">This is your private conversation with the CleverStack team. We also email you when we reply. Please do not share this link.</p>
</main>
<script>
(function () {
  'use strict';
  var token = ((location.search + location.hash).match(/[?&#]c=([A-Za-z0-9_-]{40,60})/) || [])[1] || '';
  var thread = document.getElementById('ptThread'), form = document.getElementById('ptForm'), box = document.getElementById('ptBody'), send = document.getElementById('ptSend'), err = document.getElementById('ptErr');
  var lastId = 0, lastDay = '', timer = null, busy = false;
  var STATUS = { open: 'Open', waiting: 'Awaiting your reply', won: 'Project confirmed', closed: 'Closed' };
  function fail(title, text) { document.querySelector('.pt-wrap section').outerHTML = '<section class="pt-glass pt-error"><h2>' + title + '</h2><p>' + text + '</p><p><a class="btn btn-primary" href="/contact">Contact us</a></p></section>'; document.getElementById('ptStatus').textContent = ''; }
  if (!token) { fail('Link incomplete', 'This conversation link is missing part of its address. Please open it again from your email.'); return; }
  // remove the secret from the address bar / history once read
  try { history.replaceState(null, '', location.pathname + '#c=' + token); } catch (e) {}
  function when(s) { var d = new Date(String(s).replace(' ', 'T') + 'Z'); return isNaN(d) ? { day: '', time: '' } : { day: d.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' }), time: d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' }) }; }
  function add(m) {
    var w = when(m.at);
    if (w.day && w.day !== lastDay) { var d = document.createElement('div'); d.className = 'pt-day'; d.textContent = w.day; thread.appendChild(d); lastDay = w.day; }
    var el = document.createElement('div'); el.className = 'pt-msg ' + (m.from === 'you' ? 'you' : 'them');
    var b = document.createElement('div'); b.className = 'pt-bubble'; b.textContent = m.body;
    var meta = document.createElement('div'); meta.className = 'pt-meta'; meta.textContent = (m.from === 'you' ? 'You' : (m.name || 'CleverStack')) + (w.time ? ' · ' + w.time : '');
    el.appendChild(b); el.appendChild(meta); thread.appendChild(el);
  }
  function load(first) {
    if (busy) return; busy = true;
    fetch('/api/portal?t=' + encodeURIComponent(token) + '&after=' + lastId, { cache: 'no-store' }).then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); }).then(function (x) {
      if (!x.ok) { if (first) fail('This link no longer works', x.d.error || 'Please ask us for a new link.'); return; }
      document.getElementById('ptSubject').textContent = x.d.conversation.subject;
      document.getElementById('ptStatus').innerHTML = (x.d.conversation.name ? 'Hi ' + x.d.conversation.name.split(' ')[0].replace(/[<>&]/g, '') + ' ·' : '') + '<span class="pt-pill">' + (STATUS[x.d.conversation.status] || '') + '</span>';
      var atBottom = thread.scrollHeight - thread.scrollTop - thread.clientHeight < 80;
      x.d.messages.forEach(function (m) { if (m.id > lastId) { add(m); lastId = m.id; } });
      if ((first || atBottom) && x.d.messages.length) thread.scrollTop = thread.scrollHeight;
    }).catch(function () {}).then(function () { busy = false; });
  }
  function poll() { clearInterval(timer); timer = setInterval(function () { if (document.visibilityState === 'visible') load(false); }, 6000); }
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') load(false); });
  box.addEventListener('input', function () { box.style.height = 'auto'; box.style.height = Math.min(200, box.scrollHeight) + 'px'; });
  box.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); form.requestSubmit ? form.requestSubmit() : form.dispatchEvent(new Event('submit')); } });
  form.addEventListener('submit', function (e) {
    e.preventDefault(); err.textContent = '';
    var text = box.value.trim(); if (!text) return;
    send.disabled = true; send.textContent = 'Sending…';
    fetch('/api/portal', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ t: token, body: text, company_website: form.company_website.value }) })
      .then(function (r) { return r.json().then(function (d) { if (!r.ok) throw new Error(d.error || 'Could not send'); }); })
      .then(function () { box.value = ''; box.style.height = 'auto'; load(false); setTimeout(function () { thread.scrollTop = thread.scrollHeight; }, 300); })
      .catch(function (x) { err.textContent = x.message + ' Your message is still in the box.'; })
      .then(function () { send.disabled = false; send.textContent = 'Send'; box.focus(); });
  });
  load(true); poll();
})();
</script>
</body>
</html>
